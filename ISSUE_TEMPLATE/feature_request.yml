name: Feature request
description: Suggest something a project should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you hit and what makes it awkward today.
      placeholder: I run several agents on the same repo and want to see at a glance which ones touched the same files.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: The behavior you want. A command, a setting, a screen, a rough sketch, whatever you have.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead
      description: Workarounds you use today, or how another tool handles it.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Related issues, links, or a mockup.
